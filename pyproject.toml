[project]
name = "spheremix"
version = "0.4.0"
description = "Spheremix is a library for spherical probability distributions and mixture models."
readme = "README.md"
authors = [
    { name = "Martin Kvisvik Larsen", email = "martin.kvisvik.larsen@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.2",
    "loguru>=0.7.3",
    "numpy>=2.4.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[project.scripts]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spheremix"]

[tool.uv]
package = true

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
addopts = "-n auto"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "mypy>=1.20.2",
    "pandas>=3.0.1",
    "pytest>=8.3.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8.3",
    "spheroids>=0.4.0",
]
plotting = [
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]
